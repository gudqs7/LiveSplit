name: CI

on:
  pull_request:
  push:
    branches:
      - 'master'
    tags:
      - '*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout LiveSplit
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch history
        run: git fetch --prune --unshallow --no-recurse-submodules

      - name: Checkout head_ref
        if: ${{ github.head_ref != '' }}
        run: git checkout -b ${{ github.head_ref }} || git checkout ${{ github.head_ref }}

      - name: Set up .NET environment
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: .\src\LiveSplit.Bootstrap\go.mod
          cache-dependency-path: .\src\LiveSplit.Bootstrap\go.sum

      - name: Test native bootstrap
        working-directory: .\src\LiveSplit.Bootstrap
        run: go test ./...

      - name: Build LiveSplit
        run: >
          dotnet build
          -v m
          -c Release
          -p:DebugType=None
          .\LiveSplit.slnx

      - name: Build UpdateManager.exe
        run: >
          dotnet build
          -v m
          -c UpdateManagerExe
          -p:DebugType=None
          .\src\UpdateManager\UpdateManager.csproj

      - name: Run tests
        run: >
          dotnet test
          -v m
          -c Release
          --no-restore --no-build
          .\LiveSplit.slnx

      - name: Verify release executables
        run: |
          if (!(Test-Path .\artifacts\build\release\LiveSplit.exe)) {
            throw "Native LiveSplit.exe bootstrap was not built."
          }
          if (!(Test-Path .\artifacts\build\release\LiveSplit.Managed.exe)) {
            throw "Managed LiveSplit.Managed.exe was not built."
          }

      - name: Upload build as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiveSplit_Build
          path: .\artifacts\build\release

      - name: Upload UpdateManager.exe as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: UpdateManagerExe
          path: .\artifacts\build\updatemanagerexe

      - name: Upload build to LiveSplit.github.io
        if: github.repository == 'LiveSplit/LiveSplit' && github.ref == 'refs/heads/master'
        run: |
          7z a LiveSplitDevBuild.zip .\artifacts\build\release\*
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git clone -q --branch master --single-branch "https://github.com/LiveSplit/LiveSplit.github.io.git"
          cd LiveSplit.github.io
          git checkout -q --orphan artifacts
          git reset
          mv ../LiveSplitDevBuild.zip . -force
          git add LiveSplitDevBuild.zip
          git commit -m "Add Development Build"
          git push -q --force https://action:${{ secrets.DEV_BUILD_UPLOAD }}@github.com/LiveSplit/LiveSplit.github.io.git
